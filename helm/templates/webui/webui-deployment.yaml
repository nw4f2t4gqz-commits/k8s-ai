{{- if .Values.webui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8sgpt-ai-analyzer.fullname" . }}-webui
  labels:
    app.kubernetes.io/name: webui
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.webui.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: webui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "k8sgpt-ai-analyzer.serviceAccountName" . }}
      containers:
        - name: webui
          image: "{{ .Values.webui.image.repository }}:{{ .Values.webui.image.tag }}"
          imagePullPolicy: {{ .Values.webui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "k8sgpt-ai-analyzer.fullname" . }}-skills
          env:
            - name: OLLAMA_BASE_URL
              value: "http://{{ .Release.Name }}-ollama:{{ .Values.ollama.service.port }}"
            {{- if .Values.grafanaMCP.enabled }}
            - name: GRAFANA_URL
              value: {{ .Values.grafanaMCP.grafanaUrl | quote }}
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              value: {{ .Values.grafanaMCP.serviceAccountToken | quote }}
            {{- end }}
            {{- range .Values.webui.env }}
            {{- if ne .name "OLLAMA_BASE_URL" }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.webui.resources | nindent 12 }}
          # volumeMounts:
          #   - name: app-code
          #     mountPath: /app-config
          command:
            - streamlit
            - run
            - app.py
            - --server.port=8501
            - --server.address=0.0.0.0
        {{- if .Values.grafanaMCP.enabled }}
        - name: mcp-grafana
          image: {{ .Values.grafanaMCP.image }}
          imagePullPolicy: IfNotPresent
          args:
            - -t
            - streamable-http
            - --address
            - "0.0.0.0:8000"
            - --disable-write
          env:
            - name: GRAFANA_URL
              value: {{ .Values.grafanaMCP.grafanaUrl | quote }}
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              value: {{ .Values.grafanaMCP.serviceAccountToken | quote }}
          ports:
            - name: mcp
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.grafanaMCP.resources | nindent 12 }}
        {{- end }}
      # volumes:
      #   - name: app-code
      #     configMap:
      #       name: {{ .Values.webui.configMap.name | default (include "k8sgpt-ai-analyzer.fullname" .) }}-webui
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}